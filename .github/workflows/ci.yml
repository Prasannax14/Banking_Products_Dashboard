name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'banking-dashboard/package-lock.json'

      - name: Install dependencies
        working-directory: ./banking-dashboard
        run: npm ci

      - name: Run unit and component tests
        working-directory: ./banking-dashboard
        run: npm test

      - name: Build production bundle
        working-directory: ./banking-dashboard
        run: npm run build

